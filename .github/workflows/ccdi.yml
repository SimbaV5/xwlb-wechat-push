name: 中纪委国家监委通报更新

# 北京时间 08:00 = UTC 00:00，每天早上：
# 抓取中纪委国家监委「要闻」栏目的通报/审查调查/双开类新闻，更新 App 数据包
# 独立于新闻联播任务，失败不影响主流程
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器（中纪委滑块验证码需要）
        run: python -m playwright install chromium

      - name: 抓取中纪委通报
        run: python ccdi_fetcher.py --pages 2 --limit 15 --out docs/ccdi/latest.json

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ccdi/
          if git diff --cached --quiet; then
            echo "通报数据无变化"
          else
            git commit -m "chore: 更新中纪委通报 $(date +%Y%m%d)"
            git push
          fi
