name: 每日新闻联播推送与数据更新

# 北京时间 20:30 = UTC 12:30（新闻联播 19:00 播出，文字稿 20:00~20:30 已上线）
# 每天：
# ① 抓取当天文字稿，更新 App 数据包（latest.json + 当年 years 包，自动补偿最近5天）
# ② 微信推送当天文字稿
# 注：若某天稿子上线偏晚，脚本自动回退最近有数据的一天，并在后续运行补齐缺失日期
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定日期 YYYYMMDD（可选，留空用当天）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器（公安部反爬需要）
        run: python -m playwright install chromium

      - name: 更新当天数据到数据包
        env:
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
        run: python update_daily.py

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: 更新新闻联播数据 $(date +%Y%m%d)"
            git push
          fi

      - name: 微信推送当天文字稿
        continue-on-error: true
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSH_MAX_CHARS: ${{ vars.PUSH_MAX_CHARS || '12000' }}
          PUSH_TEMPLATE: ${{ vars.PUSH_TEMPLATE || 'markdown' }}
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
        run: python main.py
