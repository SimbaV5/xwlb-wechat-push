name: 财经新闻更新

# 北京时间 12:00 / 20:00 = UTC 04:00 / 12:00，每天两次：
# 抓取东方财富财经要闻，合并历史写入 docs/finance/latest.json，供 App 财经页浏览/搜索。
on:
  schedule:
    - cron: "0 4,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取财经要闻（合并历史）
        run: python finance_fetcher.py --limit 60 --out docs/finance/latest.json

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/finance/
          if git diff --cached --quiet; then
            echo "财经数据无变化"
          else
            git commit -m "chore: 更新财经新闻 $(date +%Y%m%d)"
            git push
          fi
